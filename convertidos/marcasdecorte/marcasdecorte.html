<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Marcas de Corte - Mazurky</title>
  <link rel="stylesheet" href="css/marcasdecorte.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="title">Marcas de Corte</h1>
      <button id="btnFechar" class="btn-close" title="Fechar">×</button>
    </header>

    <main class="content">
      <div class="fieldset">
        <label class="fieldset-label">Direções das marcas</label>
        <div class="check-grid dir-grid">
          <label class="check"><input id="dir0" type="checkbox" /> Esq. Sup.</label>
          <label class="check"><input id="dir1" type="checkbox" /> Esq. Centro</label>
          <label class="check"><input id="dir2" type="checkbox" /> Esq. Inf.</label>
          <label class="check"><input id="dir3" type="checkbox" /> Dir. Sup.</label>
          <label class="check"><input id="dir4" type="checkbox" /> Dir. Centro</label>
          <label class="check"><input id="dir5" type="checkbox" /> Dir. Inf.</label>
          <label class="check"><input id="dir6" type="checkbox" /> Inf. Esq.</label>
          <label class="check"><input id="dir7" type="checkbox" /> Inf. Centro</label>
          <label class="check"><input id="dir8" type="checkbox" /> Inf. Dir.</label>
          <label class="check"><input id="dir9" type="checkbox" /> Sup. Esq.</label>
          <label class="check"><input id="dir10" type="checkbox" /> Sup. Centro</label>
          <label class="check"><input id="dir11" type="checkbox" /> Sup. Dir.</label>
        </div>
        <div class="btn-row">
          <button id="btnDesmarcar" class="button secondary">Desmarcar tudo</button>
          <button id="btnPadrao" class="button secondary">Padrão</button>
          <button id="btnMarcarTudo" class="button secondary">Marcar tudo</button>
        </div>
        <label class="check"><input id="remDir" type="checkbox" /> Lembrar direções</label>
        <label class="check"><input id="consOver" type="checkbox" checked /> Considerar sobreposição</label>
      </div>

      <div class="fieldset">
        <label class="fieldset-label">Comprimento / Distância / Sangria</label>
        <div class="row">
          <div class="field"><label for="compVer">Comprimento V</label><input id="compVer" class="input" type="number" step="any" value="5" /></div>
          <div class="field"><label for="compHor">Comprimento H</label><input id="compHor" class="input" type="number" step="any" value="5" /></div>
        </div>
        <div class="row">
          <div class="field"><label for="distVer">Distância V</label><input id="distVer" class="input" type="number" step="any" value="2" /></div>
          <div class="field"><label for="distHor">Distância H</label><input id="distHor" class="input" type="number" step="any" value="2" /></div>
        </div>
        <div class="row">
          <div class="field"><label for="sangVer">Sangria V</label><input id="sangVer" class="input" type="number" step="any" value="0" /></div>
          <div class="field"><label for="sangHor">Sangria H</label><input id="sangHor" class="input" type="number" step="any" value="0" /></div>
        </div>
        <div class="field">
          <label for="unidades">Unidades</label>
          <select id="unidades" class="select">
            <option value="0">mm</option>
            <option value="1">cm</option>
            <option value="2">pt</option>
            <option value="3">in</option>
          </select>
        </div>
      </div>

      <div class="fieldset">
        <label class="fieldset-label">Opções</label>
        <label class="check"><input id="clipMascara" type="checkbox" /> Considerar máscara de corte</label>
        <div class="row">
          <div class="field"><label for="espessura">Espessura do traço</label><input id="espessura" class="input" type="number" step="any" value="0.25" /></div>
          <div class="field small">
            <label for="espessuraUnidades">Unidade</label>
            <select id="espessuraUnidades" class="select">
              <option value="0">mm</option>
              <option value="1">cm</option>
              <option value="2" selected>pt</option>
              <option value="3">in</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="agrupar">Agrupar após</label>
          <select id="agrupar" class="select">
            <option value="0" selected>Nada</option>
            <option value="1">Apenas marcas</option>
            <option value="2">Marcas e seleção</option>
          </select>
        </div>
        <div class="field">
          <label for="cor">Cor das marcas</label>
          <select id="cor" class="select">
            <option value="0" selected>Registro (Auto)</option>
          </select>
        </div>
        <label class="check"><input id="contornoBranco" type="checkbox" /> Contorno branco nas marcas</label>
      </div>

      <div class="fieldset">
        <label class="fieldset-label">Destino</label>
        <div class="field">
          <label for="objetos">Objeto(s)</label>
          <select id="objetos" class="select"></select>
        </div>
        <div class="field">
          <label for="limites">Limites</label>
          <select id="limites" class="select">
            <option value="0" selected>Geométrico</option>
            <option value="1">Visível (considerar traços e efeitos)</option>
          </select>
        </div>
        <div class="field">
          <label for="camada">Camada</label>
          <select id="camada" class="select">
            <option value="0" selected>NOVA CAMADA</option>
          </select>
        </div>
      </div>
    </main>

    <footer id="status" class="status">
      <span id="statusText">Pronto.</span>
    </footer>

    <div class="actions">
      <button id="btnExecutar" class="button primary">Executar</button>
    </div>
  </div>

  <script src="../../js/CSInterface.js"></script>
  <script src="js/marcasdecorte.js"></script>
</body>
</html>
