<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Diminuir Resolução Imagens</title>
  <link rel="stylesheet" href="css/resolucao.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="title">Diminuir Resolução Imagens</h1>
      <button id="btnFechar" class="btn-close" title="Fechar">×</button>
    </header>

    <main class="content">
      <div class="fieldset">
        <label class="fieldset-label" for="dpi">Resolução desejada (DPI)</label>
        <input id="dpi" class="input" type="number" step="any" value="300" />
      </div>
    </main>

    <footer id="status" class="status">
      <span id="statusText">Pronto.</span>
    </footer>

    <div class="actions">
      <button id="btnExecutar" class="button primary">Executar</button>
    </div>
  </div>

  <script src="../../js/CSInterface.js"></script>
  <script src="js/resolucao.js"></script>
</body>
</html>
