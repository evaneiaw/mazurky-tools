<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Mira</title>
  <link rel="stylesheet" href="css/mira.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="title">Mira</h1>
      <button id="btnFechar" class="btn-close" title="Fechar">×</button>
    </header>

    <main class="content">
      <div class="fieldset">
        <label class="fieldset-label" for="margem">Margem (mm)</label>
        <div class="margem-row">
          <input id="margem" class="input" type="number" step="any" value="0" />
          <span id="rasterInfo" class="raster-info" title="Rasterizador detectado no documento">Raster: —</span>
        </div>
      </div>

      <div class="fieldset">
        <label class="fieldset-label">Espelhamento</label>
        <label class="check"><input type="radio" name="espelho" value="none" checked /> Não espelhar</label>
        <label class="check"><input type="radio" name="espelho" value="vertical" /> Espelhar verticalmente</label>
        <label class="check"><input type="radio" name="espelho" value="horizontal" /> Espelhar horizontalmente</label>
      </div>

      <div class="fieldset">
        <label class="check"><input id="todosArtboards" type="checkbox" /> Aplicar em todas as pranchetas</label>
      </div>
    </main>

    <footer id="status" class="status">
      <span id="statusText">Pronto.</span>
    </footer>

    <div class="actions">
      <button id="btnCancelar" class="button danger">Cancelar</button>
      <button id="btnPrevia" class="button secondary">Previa</button>
      <button id="btnExecutar" class="button primary">Executar</button>
    </div>
  </div>

  <script src="../../js/CSInterface.js"></script>
  <script src="js/mira.js"></script>
</body>
</html>
