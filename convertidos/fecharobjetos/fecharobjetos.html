<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Fechar Objetos</title>
  <link rel="stylesheet" href="css/fecharobjetos.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="title">Fechar Objetos</h1>
      <button id="btnFechar" class="btn-close" title="Fechar">×</button>
    </header>

    <main class="content">
      <div class="card-text">Selecione os objetos antes de executar.</div>

      <div class="fieldset">
        <label class="fieldset-label" for="resultado">Diagnóstico</label>
        <textarea id="resultado" class="input" rows="3" readonly></textarea>
        <button id="btnRecalcular" class="button">Recalcular</button>
      </div>

      <div class="fieldset">
        <label class="fieldset-label">Tolerância (pontos)</label>
        <div class="row">
          <div class="field small">
            <label class="fieldset-label" for="tolX">X</label>
            <input id="tolX" class="input" type="number" step="any" value="2" />
          </div>
          <div class="field small">
            <label class="fieldset-label" for="tolY">Y</label>
            <input id="tolY" class="input" type="number" step="any" value="2" />
          </div>
        </div>
      </div>

      <div class="fieldset">
        <label class="fieldset-label">Opções</label>
        <label class="check"><input id="selfClose" type="checkbox" checked /> Fechar path único (pontas próximas do mesmo path)</label>
        <label class="check"><input id="merge" type="checkbox" checked /> Unir paths diferentes (pontas próximas entre dois paths)</label>
        <label class="check"><input id="preservar" type="checkbox" /> Preservar forma original (conectar com segmento reto)</label>
      </div>
    </main>

    <footer id="status" class="status">
      <span id="statusText">Pronto.</span>
    </footer>

    <div class="actions">
      <button id="btnExecutar" class="button primary">Executar</button>
    </div>
  </div>

  <script src="../../js/CSInterface.js"></script>
  <script src="js/fecharobjetos.js"></script>
</body>
</html>
